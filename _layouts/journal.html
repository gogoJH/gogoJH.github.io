<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.display_title | default: page.title | default: '개발 기록' | escape }} — 조진혁</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f6f7f3">
    {% if page.archived %}<meta name="robots" content="noindex, follow">{% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url | replace: 'http:', 'https:' }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.display_title | default: page.title | default: '개발 기록 — 조진혁' | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url | replace: 'http:', 'https:' }}">
    <link rel="icon" href="{{ '/img/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    {% if page.layout == 'post' %}<link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}">{% endif %}
    <link rel="stylesheet" href="{{ '/css/journal.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    <script src="{{ '/js/journal.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
</head>
<body class="journal-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="조진혁 블로그 홈">
            <span class="wordmark-symbol" aria-hidden="true">jh<span>.</span></span>
            <span class="wordmark-label">조진혁 <span>/ Journal</span></span>
        </a>
        <nav aria-label="블로그 메뉴">
            <a href="{{ '/#writing' | relative_url }}">글</a>
            <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>태그</a>
            <a href="{{ '/portfolio/' | relative_url }}" class="blog-link">포트폴리오 <span aria-hidden="true">↗</span></a>
        </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="journal-footer wrap">
        <div><a class="footer-name" href="{{ '/' | relative_url }}">조진혁</a><p>만들고, 고민하고, 기록합니다.</p></div>
        <nav aria-label="하단 메뉴"><a href="https://github.com/gogoJH" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="mailto:wlsgur4033@gmail.com">Email ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a></nav>
        <span>© {{ site.time | date: '%Y' }} Jinhyuk Jo</span>
    </footer>
</body>
</html>
