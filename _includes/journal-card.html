<article class="writing-row" data-post data-category="{{ include.post.journal_category | escape }}" data-search="{{ include.post.display_title | default: include.post.title | escape }} {{ include.post.description | escape }} {{ include.post.tags | join: ' ' | escape }}">
    <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
    <div class="writing-copy">
        <span class="writing-category">{{ include.post.journal_category }}</span>
        <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.display_title | default: include.post.title | escape }}</a></h3>
        <p>{{ include.post.description | escape }}</p>
    </div>
    <span class="writing-arrow" aria-hidden="true">↗</span>
</article>
